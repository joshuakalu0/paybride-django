[project]
name = "paybridge-django"
version = "0.1.0"
description = "Reusable Django payment app for Paystack, Flutterwave, and Stripe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Aju Joshua Kalu" }
]
keywords = ["django", "payments", "paystack", "flutterwave", "stripe", "africa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "Django>=4.2,<5.3",
  "httpx>=0.27,<0.29",
  "requests>=2.32,<3.0",
  "stripe>=11.0,<12.0"
]

[project.optional-dependencies]
celery = [
  "celery>=5.4,<6.0"
]

[project.urls]
Homepage = "https://github.com/ajujoshua/booster"
Documentation = "https://github.com/ajujoshua/booster/tree/main/python/paybridge-django"
Issues = "https://github.com/ajujoshua/booster/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "build>=1.2,<2.0",
  "coverage[toml]>=7.6,<8.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-django>=4.9,<5.0",
  "responses>=0.25,<1.0",
  "respx>=0.22,<1.0",
  "ruff>=0.6,<0.9",
  "twine>=5.1,<6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/paybridge_django"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/paybridge_django/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "DJ"]

[tool.coverage.run]
branch = true
source = ["src/paybridge_django"]

[tool.uv]
package = true
