<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PayBridge Django Demo</title>
</head>
<body>
  <h1>PayBridge Django Demo</h1>
  <p>This example project shows a minimal host app wiring <code>paybridge_django</code>.</p>
  <form method="post" action="/demo-init/">
    {% csrf_token %}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="demo@example.com" />
    <button type="submit">Initialize payment</button>
  </form>
</body>
</html>
